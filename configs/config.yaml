# ============================================================================
# DEEP HEDGING + LOTTERY TICKETS + ADVERSARIAL ROBUSTNESS
# Configuration File
# ============================================================================

# Experiment identification
experiment_name: "deep_hedging_lth_adversarial"

# ============================================================================
# CACHING & CHECKPOINTING - NOUVEAU
# ============================================================================
caching:
  enabled: true
  directory: "./cache"
  # 'on': normal caching, 'off': no caching, 'update': overwrite, 'readonly': read only
  mode: "on"

checkpointing:
  enabled: true
  directory: "./checkpoints"
  # Fréquence de sauvegarde (en epochs)
  save_freq: 10
  # Garder les N derniers checkpoints
  keep_last: 3

# ============================================================================
# DATA CONFIGURATION
# ============================================================================
data:
  # Heston model parameters (calibrated to S&P500)
  heston:
    S_0: 100.0        # Initial stock price
    K: 100.0          # Strike (ATM)
    r: 0.02           # Risk-free rate
    mu: 0.02          # Real-world drift (not used in risk-neutral sim)
    v_0: 0.0175       # Initial variance (~13.2% vol)
    kappa: 1.5768     # Mean reversion speed
    theta: 0.0398     # Long-term variance (~20% vol)
    xi: 0.5751        # Vol of vol
    rho: -0.5711      # Correlation spot-vol

  # Dataset sizes
  n_train: 60000     # Number of training samples
  n_val: 15000        # Number of validation samples (1%)
  n_test: 15000       # Number of test samples

  # Simulation parameters
  T: 0.25             # 3 month in years     
  n_steps: 540        # Hedge per day (540 steps for 3 months with 4h steps)
  dt: 0.000463         # T / n_steps 

  # Transaction costs
  transaction_cost:
    c_prop: 0.001     # 10 bps proportional cost

  # Random seeds for reproducibility
  seeds:
    train: 42
    val: 43
    test: 44

# ============================================================================
# MODEL CONFIGURATION
# ============================================================================
model:
  # Input: 5 market features (exogenous) + 3 recurrent features = 8 total
  # But recurrent features are computed during forward pass
  input_dim: 5        # Only exogenous features as input
  recurrent_dim: 3    # delta_prev, pnl_cumulative, trading_volume
  # Total network input = 5 + 3 = 8
  
  # Architecture (from Buehler et al.)
  hidden_dims: [128, 64, 32]      # [256, 256, 128] or [50, 50, 20]
  dropout_rates: [0.0, 0.0, 0.0]  # Pas de dropout par défaut
  use_batch_norm: false           # Pas de batch norm par défaut (comme Buehler)
  
  # Activation
  activation: "tanh"   # 'relu', 'leaky_relu', 'tanh'

# ============================================================================
# TRAINING CONFIGURATION
# ============================================================================
training:
  # Optimizer
  optimizer_name: "adam"
  learning_rate: 0.001   # ou 0.01 (avant)
  weight_decay: 0.0
  
  # Training params
  epochs: 300 
  batch_size: 256        # 1024 ou 2048 possible     
  
  # Loss function
  loss_type: "cvar"      # 'cvar', 'entropic', 'mean_variance'
  cvar_alpha: 0.05       # 5% CVaR
  
  # Early stopping
  patience: 30
  min_delta: 0.000001
  
  # Gradient clipping
  clip_grad_norm: 1.0
  
  # Learning rate scheduler
  scheduler:
    enabled: false        # If true, use PlateauLR, however we use lr_scheduler below
    mode: "min"
    factor: 0.5
    patience: 10
    min_lr: 0.000001
    lr_scheduler: cosine     # 'cosine', 'step', or null
    lr_step_size: 50
    lr_gamma: 0.5

# ============================================================================
# PRUNING CONFIGURATION (Lottery Ticket Hypothesis)
# ============================================================================
pruning:
  # Sparsity levels to test
  sparsities: [0.5, 0.7, 0.8, 0.9, 0.95]
  
  # Default target sparsity
  target_sparsity: 0.8
  
  # Pruning method
  method: "magnitude"    # 'magnitude', 'random'
  
  # One-shot vs iterative
  iterative: false       # Ignored in practice for now, always iterative
  num_iterations: 5      # If iterative=true
  
  # Exclude output layer from pruning
  exclude_output: true
  
  # Learning rate for retraining (IMPORTANT for boosting tickets)
  # Use LOW LR for pruning phase, standard LR for retraining
  pruning_lr: 0.0001     # Very low for boosting tickets
  retrain_lr: 0.001       # (*100) Standard for retraining, 0.001
  retrain_epochs: 150

# ============================================================================
# ADVERSARIAL ATTACKS CONFIGURATION
# ============================================================================
attacks:
  # FGSM attack
  fgsm:
    epsilon_S: 0.02      # 2% perturbation on S
    epsilon_v: 0.2       # 20% perturbation on v
  
  # PGD attack
  pgd:
    epsilon_S: 0.05      # 5% perturbation on S
    epsilon_v: 0.5       # 50% perturbation on v
    alpha_S: 0.01        # Step size for S
    alpha_v: 0.1         # Step size for v
    num_steps: 10        # PGD iterations
  
  # Stress test attack
  stress:
    epsilon_S: 0.10      # 10% perturbation
    epsilon_v: 1.0       # 100% perturbation

# ============================================================================
# ADVERSARIAL TRAINING CONFIGURATION
# ============================================================================
adversarial_training:
  # Phase 1: FGSM training (to get boosting tickets)
  fgsm_phase:
    attack_type: "fgsm"
    epochs: 150
    learning_rate: 0.001  # Standard LR
  
  # Phase 2: PGD retraining with warmup
  pgd_phase:
    attack_type: "pgd"
    epochs: 200
    lr_start: 0.0002     # Warmup start 
    lr_end: 0.001        # Warmup end 0.01
    warmup_epochs: 30
    epochs_candidates: [50, 150, 200] 

# warmup settings for PGD phase
warmup:
  enabled: true
  lr_start: 0.0002
  lr_end: 0.001
  warmup_epochs: 30
  warmup_type: 'linear'    # ou 'cosine', 'exponential'
  post_warmup: 'constant'  # ou 'cosine', 'step'

# ============================================================================
# REGIME SHIFTS CONFIGURATION
# ============================================================================
regime_shifts:
  # Calm regime (baseline)
  calm:
    theta: 0.0398
    xi: 0.5751
    v_0: 0.0175
  
  # High volatility regime
  high_vol:
    theta: 0.09          # ~30% long-term vol
    xi: 0.5
    v_0: 0.04
  
  # Extreme regime
  extreme:
    theta: 0.18          # ~45% long-term vol
    xi: 0.8
    v_0: 0.08

# ============================================================================
# EVALUATION CONFIGURATION
# ============================================================================
evaluation:
  # Metrics to compute
  metrics:
    - mean_pnl
    - std_pnl
    - sharpe_ratio
    - cvar_005
    - cvar_010
    - max_drawdown
    - hedging_error_rmse
    - hedging_error_mae
  
  # Number of bootstrap samples for confidence intervals
  n_bootstrap: 1000

# ============================================================================
# LOGGING CONFIGURATION
# ============================================================================
logging:
  # TensorBoard
  use_tensorboard: true
  tensorboard_dir: "./runs"
  
  # Console output
  print_freq: 10         # Print every N epochs
  
  # Save figures
  save_figures: true
  figures_dir: "./figures"

# ============================================================================
# COMPUTE CONFIGURATION
# ============================================================================
compute:
  # Device: 'auto', 'cuda', 'cpu'
  device: "auto"
  
  # Number of workers for data loading
  num_workers: 4
  
  # Pin memory for faster GPU transfer
  pin_memory: true